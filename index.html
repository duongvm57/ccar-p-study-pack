 bị dataset có label. Sau khi chạy mới scoring, dashboard và failure review.\",\n    \"Regression testing cần stable reference set để so sánh hành vi trước/sau khi đổi model, prompt hoặc config.\",\n    \"Representative slices phải phản ánh production population. Một subset hẹp không chứng minh model fit cho production.\",\n    \"Adversarial tests đo khả năng chống bypass/tấn công. Integration tests đo pipeline nhiều component có chạy đúng cùng nhau không.\",\n    \"Observability cần correlation ID xuyên suốt request và model identity/version trên từng turn để debug drift/regression.\"\n  ],\n  G: [\n    \"Delegation phải dựa trên impact, reversibility và regulatory risk; không kết luận low-risk chỉ vì số tiền nhỏ hay thay đổi ít dòng.\",\n    \"Quyết định high-impact cần human accountability: AI có thể hỗ trợ nhưng con người vẫn chịu trách nhiệm phê duyệt.\",\n    \"Risk-stratified sampling nghĩa là review hết output low-confidence/high-impact và chỉ sample ngẫu nhiên một phần routine traffic.\",\n    \"Acceptance rate, agreement với human hay selection-rate parity chỉ là proxy; chúng không tự chứng minh correctness/fairness.\",\n    \"Với user-facing AI phải disclose AI involvement và có đường liên hệ/escalation tới con người.\"\n  ],\n  H: [\n    \"ADR (Architecture Decision Record) là tài liệu ghi context, decision, alternatives, consequences, date và authors để audit/onboarding sau này.\",\n    \"Implementation guide cần nói rõ responsibilities, contracts, sequence flows, config defaults và runbooks để team khác implement được.\",\n    \"Runbook là tài liệu vận hành: alert thường gặp, cách triage, escalation path, rollback procedure và link dashboard/log.\",\n    \"Handoff package cần architecture overview, ADRs, contracts, evaluation/reference set, runbooks và known limitations.\"\n  ]\n};\n\nconst keywordGroups = [\n  {\n    title: \"Process, lifecycle & sequencing\",\n    rows: [\n      [\"core contracts / component responsibilities\", \"kiến trúc thay đổi t n class="text-15 font-semibold text-primary">Cách đọc nếu tiếng Anh yếu</span><div class="mt-3 grid gap-2 md:grid-cols-3"><div class="rounded-md border border-primary bg-wash p-3"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-orange text-orange rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">1</span><div class="text-13 font-regular text-primary mt-2">Đừng đọc toàn bộ câu trước. Tìm cụm màu cam và đọc nghĩa tiếng Việt ngay dưới câu.</div></div><div class="rounded-md border border-primary bg-wash p-3"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-orange text-orange rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">2</span><div class="text-13 font-regular text-primary mt-2">Nhìn phần “Đáp án” và “Nhớ cụm đáp án”; đây là phần quan trọng nhất để nhớ lại nhanh.</div></div><div class="rounded-md border border-primary bg-wash p-3"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-orange text-orange rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">3</span><div class="text-13 font-regular text-primary mt-2">Chỉ mở “giải thích chi tiết” khi chưa hiểu vì sao đúng; không cần đọc hết trong lượt đầu.</div></div></div></div></div></div><div class="mt-4 grid gap-3 md:grid-cols-4"><div class="flex w-full min-w-[128px] flex-col gap-1 rounded-[10px] px-4 py-3 text-left"><span class="flex min-w-0 items-center gap-1"><span class="text-12 font-medium text-text-secondary">Tổng số câu</span></span><div class="contents select-text"><span class="text-17 font-medium text-text-primary min-w-0 select-text truncate">113</span><span class="text- -5"><div class="grid gap-3 md:grid-cols-5"><div class="rounded-lg border border-primary bg-wash p-3"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">0–10 phút</span><span class="text-12 font-regular text-primary mt-2">Đọc cheat-sheet 8 topic và các mẹo làm bài để biết khung tư duy trước. Chưa cần đọc từng câu.</span></div><div class="rounded-lg border border-primary bg-wash p-3"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">10–25 phút</span><span class="text-12 font-regular text-primary mt-2">Làm flashcard theo topic. Nếu trong 2 giây không nhớ trigger thì bấm “ôn lại” ngay.</span></div><div class="rounded-lg border border-primary bg-wash p-3"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">25–35 phút</span><span class="text-12 font-regular text-primary mt-2">Mở tab Yes/No và dropdown. Học thuộc mapping/sequence vì phần này cố định và dễ lấy điểm nhanh.</span></div><div class="rounded-lg border border-primary bg-wash p-3"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">35–45 phút</span><span class="text-12 font-regular text-primary mt-2">Quét bảng tra nhanh: chỉ đọc câu đã bấm “ôn lại” và các câu select-two.</span></div><div class="rounded-lg border border-primary bg-wash p-3"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">Trước khi thi</span><span class="text-12 font-regular text-primary mt-2">Khi phân vân, ưu tiên theo thứ tự: điều kiện bắt buộc → quyền tối thiểu → đo trước khi chạy → chặn trước khi lộ dữ liệu → con người giữ quyết định rủi ro cao.</span></div></div></div></div></div><div class="mt-8 mb-3"><div class="text-17 font-semibold text-primary">Mẹo làm bài + pattern đáp án — đọc trước khi học câu</div><div class="text-12 font-regular text-secondary mt-1">Đọc phần này trước khi học từng câu: trước hết là rule chọn đáp án, sau đó mới đến pattern thống kê khi phân vân.</div></div><div class="grid gap-4 lg:grid-cols-2"><div class="text-text-primary"><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-5"><div class="text-15 font-semibold text-primary">5 quy tắc chọn đáp án — đọc trước</div><div class="mt-4 space-y-3"><div class="rounded-lg border border-primary bg-wash p-3"><div class="flex items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-orange text-orange rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">1</span><span class="text-14 font-semibold text-primary">Ưu tiên điều kiện bắt buộc trước</span></div><div class="text-13 font-regular text-secondary mt-2">Nếu câu hỏi nhắc SLA (cam kết vận hành), security (bảo mật) hoặc compliance (tuân thủ luật/chính sách), hãy xem đó là yêu cầu bắt buộc. Bước 1: loại mọi đáp án vi phạm yêu cầu đó. Bước 2: trong các đáp án còn lại, mới so sánh chi phí, tốc độ hoặc chất lượng.</div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q52, Q58)</button></div></div><div class="rounded-lg border border-primary bg-wash p-3"><div class="flex items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-orange text-orange rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">2</span><span class="text-14 font-semibold text-primary">Xác định đúng phạm vi và đúng tầng</span></div><div class="text-13 font-regular text-secondary mt-2">Trước tiên xác định đề đang nói về cấu hình cá nhân, cấu hình chung của team/repo, hay cấu hình do tổ chức khóa. Sau đó chọn đúng tầng: Skill chứa quy trình/hướng dẫn, MCP kết nối hệ thống bên ngoài, còn quyền truy cập và audit phải nằm ở application layer.</div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q4, Q78)</button></div></div><div class="rounded-lg border border-primary bg-wash p-3"><div class="flex items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-orange text-orange rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">3</span><span class="text-14 font-semibold text-primary">Định nghĩa cách đo trước khi chạy</span></div><div class="text-13 font-regular text-secondary mt-2">Nếu đề nói BEFORE/trước khi pilot, evaluation hoặc experiment, đáp án thường là bước chuẩn bị: chọn metric (chỉ số đo), dataset (dữ liệu test), slice (nhóm dữ liệu cần tách riêng), owner (người chịu trách nhiệm) và baseline (mức hiện tại để so sánh). Đáp án nào nhảy thẳng vào chạy hoặc kết luận mà chưa định nghĩa cách đo thì thường sai.</div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q39, Q108)</button></div></div><div class="rounded-lg border border-primary bg-wash p-3"><div class="flex items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-orange text-orange rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">4</span><span class="text-14 font-semibold text-primary">Chặn dữ liệu nhạy cảm trước khi model nhìn thấy</span></div><div class="text-13 font-regular text-secondary mt-2">Với restricted data (dữ liệu bị giới hạn quyền), phải kiểm tra quyền trước retrieval/prompt/model. Nếu đáp án chỉ lọc sau khi model đã nhìn thấy dữ liệu thì là quá muộn, vì dữ liệu đã lọt vào context hoặc log.</div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q38, Q105)</button></div></div><div class="rounded-lg border border-primary bg-wash p-3"><div class="flex items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-orange text-orange rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">5</span><span class="text-14 font-semibold text-primary">Con người giữ quyết định rủi ro cao</span></div><div class="text-13 font-regular text-secondary mt-2">Nếu hành động có tác động lớn, khó hoàn tác, thuộc lĩnh vực regulated (bị luật kiểm soát) hoặc model không chắc, cần human review/escalation. Không được kết luận rủi ro thấp chỉ vì số tiền nhỏ hay thay đổi ít dòng.</div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q51, Q99)</button></div></div></div></div></div></div><div class="text-text-primary"><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-5"><div class="text-15 font-semibold text-primary">Khi phân vân, tự hỏi đúng 5 câu này</div><div class="mt-4 space-y-3"><div class="rounded-lg border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">1. Đề có nhắc SLA, security hoặc compliance không? Nếu có, đây là điều kiện bắt buộc và phải kiểm tra trước mọi lợi ích khác.</span><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q85, Q100)</button></div></div><div class="rounded-lg border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">2. Đề đang hỏi trước hay sau một bước? Chọn đúng trình tự: chuẩn bị trước, chạy sau, phân tích và kết luận cuối cùng.</span><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q56, Q108)</button></div></div><div class="rounded-lg border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">3. Chủ thể là ai và ở tầng nào: cá nhân, team repo, managed org, Skill, MCP hay application layer?</span><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q4, Q77)</button></div></div><div class="rounded-lg border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">4. Đáp án có đo và kiểm chứng được không: metric, dataset, reference set, logging hoặc audit?</span><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q72, Q81)</button></div></div><div class="rounded-lg border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">5. Nếu hành động sai thì thiệt hại lan bao xa và có hoàn tác được không? Rủi ro cao thì cần human accountability.</span><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q51, Q99)</button></div></div></div><div class="text-12 font-regular text-secondary mt-4">Nếu vẫn hòa, mới dùng pattern thống kê bên dưới. Pattern chỉ để phá hòa, không thay thế việc hiểu câu hỏi.</div></div></div></div></div><div class="mt-4 space-y-4"><div class="grid gap-4 lg:grid-cols-2"><div class="text-text-primary"><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-5"><div class="flex items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-orange text-orange rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">1</span><span class="text-15 font-semibold text-primary">Mẹo học nhanh</span></div><div class="mt-4 space-y-2"><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Học theo vòng lặp ngắn: (1) đọc keyword/từ khóa nhận biết, (2) nhìn đáp án đúng, (3) nhớ một cụm ngắn, (4) làm lại quiz. Lượt đầu không cần đọc hết giải thích dài.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Với mỗi câu chỉ cần nhớ một cặp “dấu hiệu trong đề → cách trả lời”. Ví dụ thấy repeated static prefix (phần đầu prompt lặp lại y nguyên) thì nghĩ đến prompt caching.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Ưu tiên học 9 câu Yes/No và dropdown vì sequence/mapping của chúng cố định, dễ lấy điểm nhanh hơn các câu tình huống dài.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Với câu select-two, học cả cặp đáp án như một cụm. Đừng học từng option riêng lẻ vì đề thường yêu cầu hai phần bổ sung cho nhau.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Cuối buổi chỉ ôn lại các câu đã bấm “Ôn lại”. Không cố nhồi lại toàn bộ 113 câu trong một lượt.</span></div></div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q3, Q20)</button></div></div></div></div><div class="text-text-primary"><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-5"><div class="flex items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">2</span><span class="text-15 font-semibold text-primary">Mẹo loại trừ đáp án</span></div><div class="mt-4 space-y-2"><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Loại đáp án vi phạm điều kiện bắt buộc như security, compliance, SLA, privacy hoặc least privilege, kể cả khi đáp án đó rẻ hơn hay nhanh hơn.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Loại đáp án chỉ xử lý sau khi dữ liệu nhạy cảm đã lộ. Ví dụ post-filter restricted content là quá muộn vì model đã nhìn thấy dữ liệu.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Loại đáp án chỉ có một lớp bảo vệ khi vấn đề cần defense-in-depth (nhiều lớp phòng thủ): ngăn trước, kiểm tra lúc chạy và ghi log/audit.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Loại đáp án chọn model vì newest/most capable nếu không có workload profile hoặc representative evaluation. Mới nhất/mạnh nhất không bằng phù hợp nhất.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Loại đáp án encode deterministic business logic (logic có một kết quả đúng cố định) vào prompt; loại logic này phải nằm trong code/tool.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Loại đáp án dùng số tiền nhỏ, số dòng ít hoặc UI nhỏ để kết luận low-risk. Phải xem tác động, khả năng hoàn tác và blast radius.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Loại đáp án hứa không có trade-off, không cần monitoring hoặc không cần regression testing. Kiến trúc thật luôn có đánh đổi và kiểm soát.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Loại đáp án nói chung chung, không nói ai chịu trách nhiệm, áp dụng ở đâu, bằng cơ chế nào hoặc đo bằng metric nào.</span></div></div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q51, Q105)</button></div></div></div></div><div class="text-text-primary"><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-5"><div class="flex items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-purple text-purple rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">3</span><span class="text-15 font-semibold text-primary">Mẹo keyword trong đề</span></div><div class="mt-4 space-y-2"><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">before / prerequisite / phase (trước khi/điều kiện tiên quyết/giai đoạn) → chọn bước chuẩn bị phải hoàn thành trước, không chọn hành động chạy sau.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">security-critical / cannot override / org-wide → ưu tiên cấu hình tập trung do tổ chức khóa, không chọn tiện lợi cá nhân.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">team-shared / repo / version-controlled → project scope (cấu hình chung của repo/team). personal preference → user scope (cấu hình cá nhân).</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">repeated static prefix / same document nhiều lần → prompt caching. dynamic retrieval/history → cắt bớt hoặc chọn lại context thay đổi.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">paraphrase/semantic → dense retrieval (tìm theo ý nghĩa). exact identifier/rare token → sparse retrieval (tìm đúng từ/mã hiếm). filter/aggregate → structured query (truy vấn có cấu trúc).</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">representative / production population / silent drift → cần slice đại diện production, reference set ổn định và score theo model version.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">retrieved content/user input instructs model → xem đó là untrusted input và nghĩ đến prompt-injection defense.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">executive/stakeholder/steering committee → nói decision, business impact và trade-off trước; technical detail để sau.</span></div></div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q93, Q38)</button></div></div></div></div><div class="text-text-primary"><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-5"><div class="flex items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-green text-green rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">4</span><span class="text-15 font-semibold text-primary">Mẹo theo dạng câu</span></div><div class="mt-4 space-y-2"><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">MCQ một đáp án: chọn đáp án nói rõ ai làm, ở tầng nào, bằng cơ chế nào. Đáp án chỉ đúng một nửa thường là bẫy.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Select-two: tìm hai đáp án bổ sung cho nhau để hoàn thành solution, ví dụ measure + enforce, prevention + detection, hoặc config + operations.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Yes/No: chấm từng statement độc lập. Một statement đúng không kéo các statement còn lại thành đúng.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Dropdown: đọc category trước rồi map từng dòng. Tìm từ khóa phân biệt như hierarchy, record, stage hoặc lifecycle.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Nếu không chắc: ưu tiên đáp án đo được, enforce được, theo least-privilege và giữ human accountability ở quyết định rủi ro cao.</span></div></div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q12, Q20)</button></div></div></div></div></div><div class="text-text-primary"><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-5"><div class="text-15 font-semibold text-primary">Mẹo bao phủ 8 topic trong đề</div><div class="mt-4 grid gap-3 md:grid-cols-2"><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-semibold text-primary">A — Lifecycle</span><div class="text-12 font-regular text-secondary mt-1">Nếu core contract hoặc component responsibility thay đổi thì phải quay lại design. Với câu hỏi trước/sau, nhớ bước chuẩn bị hoặc tài liệu/cấu hình nào phải tồn tại trước.</div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q1, Q37)</button></div></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-semibold text-primary">B — Business/stakeholder</span><div class="text-12 font-regular text-secondary mt-1">Xác định audience trước: executive cần decision/business/trade-off, engineering cần implementation detail, security reviewer cần threat/control/residual risk.</div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q9, Q113)</button></div></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-semibold text-primary">C — Claude Code/MCP/Skills</span><div class="text-12 font-regular text-secondary mt-1">Luôn hỏi scope nào, layer nào và quyền tối thiểu nào. Skill không phải live external system; MCP không thay permission boundary của application.</div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q4, Q25)</button></div></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-semibold text-primary">D — RAG/prompt/cost</span><div class="text-12 font-regular text-secondary mt-1">Cache phần prompt ổn định, cắt bớt phần context thay đổi, route model theo workload và chọn retrieval đúng loại query.</div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q3, Q93)</button></div></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-semibold text-primary">E — Security/compliance</span><div class="text-12 font-regular text-secondary mt-1">Điều kiện bắt buộc đứng trước ROI. Kiểm tra quyền trước retrieval, giữ secret server-side, HIPAA/GDPR cần contract và audit.</div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q38, Q58)</button></div></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-semibold text-primary">F — Evaluation/observability</span><div class="text-12 font-regular text-secondary mt-1">Metric/dataset/slice phải có trước khi chạy evaluation. Regression cần reference set ổn định; observability cần correlation ID và model version.</div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q72, Q81)</button></div></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-semibold text-primary">G — Human/ethics</span><div class="text-12 font-regular text-secondary mt-1">Không đo rủi ro chỉ bằng tiền hay số dòng. Quyết định high-impact/khó hoàn tác cần human approval hoặc escalation.</div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q51, Q99)</button></div></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-semibold text-primary">H — Docs/runbook/handoff</span><div class="text-12 font-regular text-secondary mt-1">Decision lâu dài dùng ADR. Vận hành dùng runbook. Handoff cần contracts, evaluation artifacts (kết quả/test đánh giá), runbooks và limitations.</div><div data-closed="" class="flex flex-col mt-2"><button type="button" tabindex="0" aria-disabled="false" aria-expanded="false" class="group flex w-full cursor-pointer items-center gap-1 py-1 text-left hover:text-text-primary-strong focus-ring disabled:pointer-events-none disabled:opacity-50 text-xs font-medium text-blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 group-data-[panel-open]:rotate-90"><path d="M9 5l7 7-7 7"></path></svg>Xem ví dụ từ đề (Q21, Q101)</button></div></div></div></div></div></div></div><div class="text-text-primary mt-4"><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-5"><div class="text-15 font-semibold text-primary">Pattern thống kê — chỉ dùng khi phân vân</div><div class="text-12 font-regular text-secondary mt-1">Mỗi card có 2 phần: con số thật trong bank 113 câu, và cách dùng khi làm bài. Không phải quy luật chung của kỳ thi.</div><div class="mt-4 space-y-3"><div class="rounded-lg border border-primary bg-wash p-4"><div class="flex flex-wrap items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">1</span><span class="text-14 font-semibold text-primary">Từ tuyệt đối: always / every / entirely / regardless / all</span></div><div class="mt-3 grid gap-3 md:grid-cols-2"><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Con số trong bank</span><div class="text-13 font-regular text-primary mt-1">Trong bank này: always đúng 0/2 lần, every 2/32, entirely 0/11, regardless 1/9, all 8/47.</div></div><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Cách dùng khi làm bài</span><div class="text-13 font-regular text-primary mt-1">Mặc định nghi ngờ vì các từ này thường làm đáp án quá cứng. Chỉ chọn khi đề thật sự nói đó là yêu cầu bắt buộc về bảo mật hoặc compliance.</div></div></div></div><div class="rounded-lg border border-primary bg-wash p-4"><div class="flex flex-wrap items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">2</span><span class="text-14 font-semibold text-primary">Đáp án có chữ “only”</span></div><div class="mt-3 grid gap-3 md:grid-cols-2"><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Con số trong bank</span><div class="text-13 font-regular text-primary mt-1">Chỉ đúng 5/22 lần xuất hiện trong bank.</div></div><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Cách dùng khi làm bài</span><div class="text-13 font-regular text-primary mt-1">Thường là bẫy vì kiến trúc tốt hiếm khi chỉ dùng một mechanism. Kiểm tra xem có cần thêm authorization, validation, logging hoặc human review không.</div></div></div></div><div class="rounded-lg border border-primary bg-wash p-4"><div class="flex flex-wrap items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">3</span><span class="text-14 font-semibold text-primary">Đáp án hứa “without …”</span></div><div class="mt-3 grid gap-3 md:grid-cols-2"><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Con số trong bank</span><div class="text-13 font-regular text-primary mt-1">Chỉ đúng 3/45 lần xuất hiện trong bank.</div></div><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Cách dùng khi làm bài</span><div class="text-13 font-regular text-primary mt-1">Nghi ngờ các câu kiểu “không cần trade-off”, “không ảnh hưởng latency” hoặc “không cần monitoring”. Lời hứa loại trừ hết trade-off thường phi thực tế.</div></div></div></div><div class="rounded-lg border border-primary bg-wash p-4"><div class="flex flex-wrap items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">4</span><span class="text-14 font-semibold text-primary">Đáp án dài hay ngắn?</span></div><div class="mt-3 grid gap-3 md:grid-cols-2"><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Con số trong bank</span><div class="text-13 font-regular text-primary mt-1">Ở 59 câu chọn một: đáp án đúng nằm trong nhóm dài nhất 22/59 lần, ngắn nhất 13/59 lần (tính cả trường hợp hòa độ dài).</div></div><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Cách dùng khi làm bài</span><div class="text-13 font-regular text-primary mt-1">Đáp án tốt thường dài vì nói đủ boundary/owner/mechanism. Nhưng độ dài chỉ là tie-breaker yếu, không đủ để chọn đáp án.</div></div></div></div><div class="rounded-lg border border-primary bg-wash p-4"><div class="flex flex-wrap items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">5</span><span class="text-14 font-semibold text-primary">Vị trí A/B/C/D</span></div><div class="mt-3 grid gap-3 md:grid-cols-2"><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Con số trong bank</span><div class="text-13 font-regular text-primary mt-1">Tỷ lệ xuất hiện trong correct set gần đều: A 33%, B 29%, C 32%, D 34% (cộng &gt;100% vì có câu chọn 2).</div></div><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Cách dùng khi làm bài</span><div class="text-13 font-regular text-primary mt-1">Không có pattern theo chữ cái. Đừng chọn theo vị trí.</div></div></div></div><div class="rounded-lg border border-primary bg-wash p-4"><div class="flex flex-wrap items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">6</span><span class="text-14 font-semibold text-primary">Câu “select two”</span></div><div class="mt-3 grid gap-3 md:grid-cols-2"><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Con số trong bank</span><div class="text-13 font-regular text-primary mt-1">45/104 câu MCQ là select-two; tất cả đều có 5 options.</div></div><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Cách dùng khi làm bài</span><div class="text-13 font-regular text-primary mt-1">Thường tìm một cặp cùng bổ sung cho nhau: một phần đo/định nghĩa và một phần enforce/vận hành, hoặc prevention + detection.</div></div></div></div><div class="rounded-lg border border-primary bg-wash p-4"><div class="flex flex-wrap items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">7</span><span class="text-14 font-semibold text-primary">Yes/No</span></div><div class="mt-3 grid gap-3 md:grid-cols-2"><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Con số trong bank</span><div class="text-13 font-regular text-primary mt-1">29 statements: 17 Yes, 12 No.</div></div><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Cách dùng khi làm bài</span><div class="text-13 font-regular text-primary mt-1">Yes thường là nguyên tắc đo được, kiến trúc đúng layer hoặc least-privilege. No thường là shortcut, bỏ qua drift, chọn ngẫu nhiên hoặc vi phạm privacy.</div></div></div></div><div class="rounded-lg border border-primary bg-wash p-4"><div class="flex flex-wrap items-center gap-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">8</span><span class="text-14 font-semibold text-primary">Verb mở đầu đáp án</span></div><div class="mt-3 grid gap-3 md:grid-cols-2"><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Con số trong bank</span><div class="text-13 font-regular text-primary mt-1">Sample nhỏ trong bank: define/identify/enable/verify/cache thường đúng; document 0/6 lần mở đầu là đúng.</div></div><div class="rounded-md border border-primary bg-elevated p-3"><span class="text-12 font-semibold text-secondary">Cách dùng khi làm bài</span><div class="text-13 font-regular text-primary mt-1">Đây chỉ là tie-breaker rất yếu. Quan trọng hơn là đáp án nói rõ object nào, boundary nào, ai sở hữu và enforce bằng cơ chế nào.</div></div></div></div></div></div></div></div><div class="mt-8 mb-3"><div class="text-17 font-semibold text-primary">Cheat-sheet theo chủ đề</div><div class="text-12 font-regular text-secondary mt-1">Học mantra của từng nhóm trước; phần lớn câu hỏi chỉ là biến thể của các rule này.</div></div><div class="grid gap-4 md:grid-cols-[280px_1fr]"><div class="text-text-primary"><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-5"><span class="text-13 font-semibold text-primary">8 nhóm chủ đề</span><div class="mt-3 space-y-2"><button type="button" tabindex="0" class="inline-flex touch-manipulation select-none font-medium max-w-full items-center overflow-hidden outline-none [-webkit-touch-callout:none] disabled:opacity-50 shrink-0 focus-ring [&amp;&gt;:where(span)]:min-w-0 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:first-child:not(:last-child)]:mr-[4px] [&amp;_svg:last-child:not(:first-child)]:ml-[2px] bg-bg-elevated-transparent text-text-primary border border-border-primary light:bg-clip-padding can-hover:text-text-primary can-hover:bg-[image:linear-gradient(rgb(var(--tint-tertiary)),rgb(var(--tint-tertiary))),linear-gradient(rgb(var(--bg-elevated-transparent)),rgb(var(--bg-elevated-transparent)))] data-[pressed]:bg-[image:linear-gradient(rgb(var(--tint-tertiary)),rgb(var(--tint-tertiary))),linear-gradient(rgb(var(--bg-elevated-transparent)),rgb(var(--bg-elevated-transparent)))] rounded-[6px] px-[8px] gap-[3px] text-12 [&amp;_svg]:size-[14px] w-full justify-start whitespace-normal text-left h-auto py-2"><span class="truncate">8 câu — Lifecycle, yêu cầu và kiến trúc</span></button><button type="button" tabindex="0" class="inline-flex touch-manipulation select-none font-medium max-w-full items-center overflow-hidden outline-none [-webkit-touch-callout:none] disabled:opacity-50 shrink-0 focus-ring [&amp;&gt;:where(span)]:min-w-0 [&amp;_sv d-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Thứ tự ưu tiên cấu hình Claude Code: managed configuration do org khóa &gt; command-line arguments &gt; local scope &gt; project scope &gt; user scope. Security baseline không được phép bị user ghi đè.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Project scope là cấu hình chung của repo/team, ví dụ .claude/settings.json, .mcp.json, CLAUDE.md. User scope là preference cá nhân đi theo từng engineer.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Skill chứa procedural knowledge (quy trình, ví dụ, cách làm) và không cần kết nối live system. MCP dùng để nối live tools/data bên ngoài và có thể dùng lại giữa các AI client.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Nếu có quá nhiều tool làm đầy context, dùng Tool Search/progressive discovery để chỉ load tool khi cần; không xóa mất capability.</span></div><div class="rounded-md border border-primary bg-wash p-3"><span class="text-13 font-regular text-primary">Subagent phù hợp khi một specialized task lặp lại và cần prompt, model hoặc nhóm tool hẹp riêng.</span></div></div><span class="text-12 font-regular text-secondary mt-4">Câu trong nhóm: Q4, Q5, Q13, Q14, Q16, Q17, Q26, Q33, Q35, Q43, Q53, Q57, Q59, Q62, Q67, Q71, Q77, Q78, Q89, Q94, Q95, Q97, Q98, Q103, Q107, Q110</span></div></div></div></div><div class="mt-8 mb-3"><div class="text-17 font-semibold text-primary">Từ điển nhanh cho người yếu tiếng Anh</div><div class="text-12 font-regular text-secondary mt-1">Từ vựng tối thiểu để không bị choáng khi đọc câu hỏi tiếng Anh.</div></div><div class="text-text-primary"><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px]"><div class="px-[14px] py-5"><div clas
