const vocabRegexSource = vocabulary.slice().sort((a,b) => b[0].length - a[0].length).map(v => v[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
function vocabEntry(term) {
  return vocabulary.find(v => v[0].toLowerCase() === term.toLowerCase());
}
function glossedParts(text) {
  const source = text || "";
  const rx = new RegExp("\\b(" + vocabRegexSource + ")\\b", "gi");
  const out = [];
  let last = 0;
  let match;
  while ((match = rx.exec(source))) {
    if (match.index > last) out.push(source.slice(last, match.index));
    const entry = vocabEntry(match[0]);
    out.push(<span key={out.length + "-g"} title={entry ? entry[1] : ""} className="rounded bg-tint-orange px-1 font-medium text-primary">{match[0]}</span>);
    last = match.index + match[0].length;
  }
  if (last < source.length) out.push(source.slice(last));
  return out;
}
function GlossedText({ text, size = 13, weight, className = "" }) {
  return <Text size={size} weight={weight} className={className}>{glossedParts(text)}</Text>;
}
function vocabMatches(texts) {
  const joined = (texts || []).filter(Boolean).join(" ").toLowerCase();
  return vocabulary.filter(v => joined.includes(v[0].toLowerCase())).slice(0, 5);
}
function VocabChips({ texts }) {
  const found = vocabMatches(texts);
  if (!found.length) return null;
  return <div className="mt-2 rounded-lg border border-orange bg-tint-orange p-2">
    <Text size={11} weight="semibold" className="text-primary">Từ khóa cần hiểu:</Text>
    <div className="mt-1 space-y-1">
      {found.map((v, i) => <Text as="div" size={11} className="text-primary" key={i}><b>{v[0]}</b> = {v[1]}</Text>)}
    </div>
  </div>;
}
function VocabInline({ texts }) {
  const found = vocabMatches(texts);
  if (!found.length) return null;
  return <Text as="div" size={11} className="text-secondary mt-1">{found.map(v => v[0] + " = " + v[1]).join(" · ")}</Text>;
}

function sameLetters(a, b) {
  return a.length === b.length && a.every(x => b.includes(x));
}

function QuestionPracticeCard({ q, mode }) {
  const [revealed, setRevealed] = useState(false);
  const [selectedMcq, setSelectedMcq] = useState([]);
  const [selectedRows, setSelectedRows] = useState({});
  const correctLetters = q.options ? q.options.filter(o => o.correct).map(o => o.letter) : [];
  const multi = correctLetters.length > 1;
  const rowCount = q.rows ? q.rows.length : 0;
  const answeredRows = Object.keys(selectedRows).length;
  const result = !revealed ? null : (q.options ? sameLetters(selectedMcq, correctLetters) : q.rows.every((r, i) => selectedRows[i] === r.answer));

  function chooseMcq(letter) {
    if (revealed) return;
    if (multi) {
      setSelectedMcq(selectedMcq.includes(letter) ? selectedMcq.filter(x => x !== letter) : selectedMcq.concat(letter));
    } else {
      setSelectedMcq([letter]);
    }
  }
  function chooseRow(i, value) {
    if (revealed) return;
    setSelectedRows({ ...selectedRows, [i]: value });
  }

  const instruction = q.options
    ? (multi ? "Chọn đúng " + correctLetters.length + " đáp án rồi chấm" : "Chọn 1 đáp án rồi chấm")
    : (q.type === "yesno" ? "Chọn Yes/No cho từng statement rồi chấm" : "Chọn mapping cho từng dòng rồi chấm");
  const progress = q.options
    ? (selectedMcq.length + "/" + correctLetters.length + " đã chọn")
    : (answeredRows + "/" + rowCount + " dòng đã chọn");

  return <Card className="mt-4">
    <CardContent>
      <CardBody>
        <div className="flex flex-wrap items-center gap-2">
          <Badge variant="purple">Q{q.n}</Badge>
          <Badge>{q.topic}</Badge>
          <Badge variant="orange">{q.kindLabel}</Badge>
          <Badge variant="blue">{instruction}</Badge>
        </div>
        <GlossedText text={q.stem} size={15} weight="medium" className="text-primary mt-3" />
        <VocabChips texts={[q.stem, q.correctSummary]} />
        {q.options ? <div className="mt-4 space-y-2">
          {q.options.map(o => {
            const selected = selectedMcq.includes(o.letter);
            const stateBadge = revealed && o.correct ? <Badge variant="success">Đúng</Badge> : revealed && selected && !o.correct ? <Badge variant="destructive">Sai</Badge> : selected ? <Badge variant="blue">Đang chọn</Badge> : null;
            return <Button key={o.letter} variant={selected ? "primary-accent" : "secondary"} size="sm" className="w-full justify-start whitespace-normal text-left h-auto py-2" onClick={() => chooseMcq(o.letter)}>
              <div className="flex w-full items-start gap-2">
                <Text size={13} weight="semibold" className="text-primary">{o.letter}.</Text>
                <div className="flex-1"><GlossedText text={o.text} size={13} className="text-primary" /></div>
                {stateBadge}
              </div>
            </Button>;
          })}
        </div> : null}
        {q.rows ? <div className="mt-4 space-y-2">
          {q.rows.map((r, i) => {
            const picked = selectedRows[i];
            const rowCorrect = revealed && picked === r.answer;
            const rowWrong = revealed && picked && picked !== r.answer;
            const dropdownOptions = Array.from(new Set(q.rows.map(x => x.answer))).map(x => ({ value: x, label: x }));
            return <div key={i} className="rounded-md border border-primary bg-elevated p-3">
              <div className="flex flex-wrap items-start gap-2">
                <div className="flex-1"><GlossedText text={r.label} size={13} className="text-primary" /></div>
                {rowCorrect ? <Badge variant="success">Đúng</Badge> : null}
                {rowWrong ? <Badge variant="destructive">Sai — đáp án: {r.answer}</Badge> : null}
              </div>
              {q.type === "yesno" ? <div className="mt-2 flex flex-wrap gap-2">
                <Button variant={picked === "Y" ? "primary-accent" : "secondary"} size="sm" onClick={() => chooseRow(i, "Y")}>Yes</Button>
                <Button variant={picked === "N" ? "primary-accent" : "secondary"} size="sm" onClick={() => chooseRow(i, "N")}>No</Button>
              </div> : <div className="mt-2 max-w-[420px]">
                <SimpleSelect value={picked || null} onValueChange={v => chooseRow(i, v)} placeholder="Chọn mapping" options={dropdownOptions} disabled={revealed} />
              </div>}
            </div>;
          })}
        </div> : null}
        <div className="mt-4 flex flex-wrap items-center gap-2">
          <Button variant="primary-accent" size="sm" onClick={() => setRevealed(!revealed)}>{revealed ? "Ẩn đáp án" : "Chấm / lật đáp án"}</Button>
          <Text size={12} className="text-secondary">{progress}</Text>
        </div>
        <AnswerDetails q={q} revealed={revealed} result={result} />
      </CardBody>
    </CardContent>
  </Card>;
}

const exampleStopwords = new Set(["which", "what", "when", "where", "should", "would", "could", "answer", "correct", "solution", "select", "before", "after", "every", "only", "with", "without", "based", "using", "used", "must", "than", "then", "that", "this", "these", "those", "the", "and", "for", "from", "into", "are", "not", "can", "all", "any", "each", "part", "complete", "presents", "their", "your", "they", "them", "have", "has", "been", "being", "more", "most", "best", "whether"]);
function exampleKeywords(q) {
  const text = [q.correctSummary, q.memory].filter(Boolean).join(" ").toLowerCase();
  return Array.from(new Set(text.replace(/[^a-z0-9\s-]/g, " ").split(/\s+/).filter(w => w.length > 4 && !exampleStopwords.has(w))));
}
const exampleCueTerms = ["security", "privacy", "compliance", "regulated", "hipaa", "gdpr", "baa", "dpa", "audit", "credential", "restricted", "authorized", "role-based", "patient", "financial", "sla", "slo", "latency", "throughput", "availability", "error budget", "performance", "cost", "budget", "before", "after", "upstream", "first", "prior to", "sequence", "prerequisite", "experiment", "evaluation", "pilot", "rollout", "candidate", "baseline", "regression", "drift", "model version", "testing", "managed configuration", "project scope", "user scope", "command-line", "team", "individual", "organization", "human review", "oversight", "delegat", "risk", "high-impact", "low-confidence", "infeasible", "irreversible", "blast radius", "repeated", "static prefix", "cache", "exact identifier", "paraphrase", "structured filter", "dense", "sparse", "skill", "mcp", "direct api", "subagent", "agent loop", "deterministic", "stakeholder", "communication", "adr", "runbook", "postmortem", "implementation guide", "external", "finance", "refund", "high-volume", "classification", "controlled", "random assignment", "workload", "production"];
function scoredExampleParts(q) {
  const sentences = (q.stem || "").match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [q.stem || ""];
  const keywords = exampleKeywords(q);
  const vocabHits = vocabulary.filter(([term]) => (q.stem || "").toLowerCase().includes(term.toLowerCase()));
  const scored = sentences.map(sentence => {
    const lower = sentence.toLowerCase();
    let score = 0;
    if (vocabHits.some(([term]) => lower.includes(term.toLowerCase()))) score += 2;
    exampleCueTerms.forEach(term => { if (lower.includes(term)) score += term.includes(" ") ? 1.5 : 1; });
    keywords.forEach(word => { if (lower.includes(word)) score += word.length >= 8 ? 1.5 : 1; });
    if (/^\s*(which|what|where|how)\b/i.test(sentence)) score -= 3.5;
    return score;
  });
  const max = Math.max.apply(null, scored.concat([0]));
  return sentences.map((sentence, index) => ({ sentence, hit: max > 0 && (scored[index] === max || scored[index] >= Math.max(2, max * 0.75)) }));
}
function ExampleStem({ q }) {
  return <div className="flex-1 text-xs font-medium leading-relaxed text-primary">
    {scoredExampleParts(q).map((part, index) => <span key={index} className={part.hit ? "rounded bg-tint-orange px-1" : ""}>{glossedParts(part.sentence)}</span>)}
  </div>;
}
function formatEliminationReason(text) {
  return (text || "").replace(/^([A-Z]|Statement \d+|Block \d+)\s+:\s*/, "$1 — ");
}
function ExampleAnswerGuide({ q }) {
  return <div className="mt-3 space-y-2">
    {q.explanation ? <div className="rounded-md border border-green bg-tint-green p-2">
      <Text as="div" size={12} className="text-primary"><b>Cách chọn đáp án:</b> {q.explanation}</Text>
    </div> : null}
    {q.elim && q.elim.length ? <div className="rounded-md border border-primary bg-wash p-2">
      <Text as="div" size={12} weight="semibold" className="text-primary">Loại trừ nhanh các phương án sai:</Text>
      <div className="mt-1 space-y-1">
        {q.elim.map((reason, index) => <Text as="div" size={12} className="text-secondary" key={index}>• {formatEliminationReason(reason)}</Text>)}
      </div>
    </div> : null}
  </div>;
}
